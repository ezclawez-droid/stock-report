<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老大股票投資報告</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;
            background: linear-gradient(90deg, #00d4ff, #9b59b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .summary-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .summary-row:last-child {
            border-bottom: none;
        }
        .summary-row.total {
            font-size: 1.3rem;
            font-weight: bold;
            margin-top: 10px;
            padding-top: 16px;
            border-top: 2px solid rgba(255,255,255,0.2);
        }
        .label {
            color: rgba(255,255,255,0.7);
        }
        .value {
            font-weight: 600;
        }
        .positive { color: #00d4ff; }
        .negative { color: #ff6b6b; }
        
        .stock-card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .stock-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        .stock-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .stock-name {
            font-size: 1.2rem;
            font-weight: bold;
        }
        .stock-symbol {
            color: rgba(255,255,255,0.5);
            font-size: 0.9rem;
        }
        .stock-price {
            text-align: right;
        }
        .current-price {
            font-size: 1.5rem;
            font-weight: bold;
        }
        .price-change {
            font-size: 0.9rem;
        }
        .stock-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .detail-item {
            background: rgba(255,255,255,0.05);
            padding: 12px;
            border-radius: 8px;
        }
        .detail-label {
            color: rgba(255,255,255,0.5);
            font-size: 0.8rem;
            margin-bottom: 4px;
        }
        .detail-value {
            font-size: 1.1rem;
            font-weight: 600;
        }
        
        .btn {
            background: linear-gradient(90deg, #00d4ff, #9b59b6);
            border: none;
            color: white;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s, transform 0.2s;
        }
        .btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: rgba(255,255,255,0.7);
        }
        .last-updated {
            text-align: center;
            color: rgba(255,255,255,0.5);
            font-size: 0.85rem;
            margin-top: 16px;
        }
        .error {
            background: rgba(255,107,107,0.2);
            border: 1px solid #ff6b6b;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
            color: #ff6b6b;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 老大股票投資報告</h1>
        
        <div class="summary-card">
            <div class="summary-row">
                <span class="label">總成本</span>
                <span class="value" id="total-cost">$1,000,000</span>
            </div>
            <div class="summary-row">
                <span class="label">總現值</span>
                <span class="value" id="total-value">載入中...</span>
            </div>
            <div class="summary-row">
                <span class="label">總損益</span>
                <span class="value" id="total-pnl">載入中...</span>
            </div>
            <div class="summary-row total">
                <span class="label">報酬率</span>
                <span class="value" id="total-return">載入中...</span>
            </div>
        </div>

        <div id="error-container"></div>
        
        <div id="stocks-container">
            <div class="stock-card" id="stock-2330">
                <div class="stock-header">
                    <div>
                        <div class="stock-name">台積電</div>
                        <div class="stock-symbol">2330</div>
                    </div>
                    <div class="stock-price">
                        <div class="current-price" id="price-2330">載入中...</div>
                        <div class="price-change" id="change-2330"></div>
                    </div>
                </div>
                <div class="stock-details">
                    <div class="detail-item">
                        <div class="detail-label">持股</div>
                        <div class="detail-value">162 股</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">成本</div>
                        <div class="detail-value">$1,850/股</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">成本總額</div>
                        <div class="detail-value">$299,700</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">現值總額</div>
                        <div class="detail-value" id="value-2330">-</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">損益</div>
                        <div class="detail-value" id="pnl-2330">-</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">報酬率</div>
                        <div class="detail-value" id="return-2330">-</div>
                    </div>
                </div>
            </div>

            <div class="stock-card" id="stock-2303">
                <div class="stock-header">
                    <div>
                        <div class="stock-name">聯電</div>
                        <div class="stock-symbol">2303</div>
                    </div>
                    <div class="stock-price">
                        <div class="current-price" id="price-2303">載入中...</div>
                        <div class="price-change" id="change-2303"></div>
                    </div>
                </div>
                <div class="stock-details">
                    <div class="detail-item">
                        <div class="detail-label">持股</div>
                        <div class="detail-value">500 股</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">成本</div>
                        <div class="detail-value">$59.1/股</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">成本總額</div>
                        <div class="detail-value">$29,550</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">現值總額</div>
                        <div class="detail-value" id="value-2303">-</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">損益</div>
                        <div class="detail-value" id="pnl-2303">-</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">報酬率</div>
                        <div class="detail-value" id="return-2303">-</div>
                    </div>
                </div>
            </div>
        </div>

        <button class="btn" id="refresh-btn" onclick="fetchPrices()">
            🔄 更新股價
        </button>
        
        <div class="last-updated" id="last-updated"></div>
    </div>

    <script>
        const TOTAL_COST = 1000000;
        const stocks = {
            '2330': { name: '台積電', shares: 162, cost: 1850 },
            '2303': { name: '聯電', shares: 500, cost: 59.1 }
        };

        let prices = {};
        let previousPrices = {};

        function formatMoney(num) {
            return '$' + Math.round(num).toLocaleString('zh-TW');
        }

        function formatPercent(num) {
            const sign = num >= 0 ? '+' : '';
            return sign + num.toFixed(2) + '%';
        }

        async function fetchPrices() {
            const btn = document.getElementById('refresh-btn');
            btn.disabled = true;
            btn.textContent = '⏳ 抓取股價中...';
            
            // 儲存舊價格
            previousPrices = { ...prices };
            
            try {
                // 使用 Google Finance API 獲取台股價格
                const response = await fetch(
                    `https://query1.finance.yahoo.com/v8/finance/chart/2330.TW?interval=1d&range=1d`
                );
                const data = await response.json();
                prices['2330'] = data.chart.result[0].meta.regularMarketPrice;
                
                const response2 = await fetch(
                    `https://query1.finance.yahoo.com/v8/finance/chart/2303.TW?interval=1d&range=1d`
                );
                const data2 = await response2.json();
                prices['2303'] = data2.chart.result[0].meta.regularMarketPrice;
                
                document.getElementById('error-container').innerHTML = '';
                updateDisplay();
                
                const now = new Date();
                document.getElementById('last-updated').textContent = 
                    `最後更新：${now.toLocaleString('zh-TW')}`;
                
            } catch (error) {
                console.error('Error fetching prices:', error);
                document.getElementById('error-container').innerHTML = 
                    `<div class="error">❌ 取得股價失敗，請稍後再試</div>`;
            } finally {
                btn.disabled = false;
                btn.textContent = '🔄 更新股價';
            }
        }

        function updateDisplay() {
            // 更新各股價格
            for (const [symbol, stock] of Object.entries(stocks)) {
                const price = prices[symbol];
                if (!price) continue;
                
                document.getElementById(`price-${symbol}`).textContent = `$${price}`;
                
                // 計算漲跌
                const changeEl = document.getElementById(`change-${symbol}`);
                if (previousPrices[symbol]) {
                    const change = price - previousPrices[symbol];
                    const changePercent = (change / previousPrices[symbol]) * 100;
                    changeEl.textContent = `${change >= 0 ? '▲' : '▼'} ${Math.abs(change).toFixed(2)} (${formatPercent(changePercent)})`;
                    changeEl.className = `price-change ${change >= 0 ? 'positive' : 'negative'}`;
                } else {
                    changeEl.textContent = '';
                }
                
                // 計算現值、損益
                const value = price * stock.shares;
                const cost = stock.cost * stock.shares;
                const pnl = value - cost;
                const returnRate = (pnl / cost) * 100;
                
                document.getElementById(`value-${symbol}`).textContent = formatMoney(value);
                
                const pnlEl = document.getElementById(`pnl-${symbol}`);
                pnlEl.textContent = formatMoney(pnl);
                pnlEl.className = `detail-value ${pnl >= 0 ? 'positive' : 'negative'}`;
                
                const returnEl = document.getElementById(`return-${symbol}`);
                returnEl.textContent = formatPercent(returnRate);
                returnEl.className = `detail-value ${returnRate >= 0 ? 'positive' : 'negative'}`;
            }
            
            // 更新總計
            const totalValue = Object.entries(stocks).reduce((sum, [symbol, stock]) => {
                return sum + (prices[symbol] || 0) * stock.shares;
            }, 0);
            const totalPnl = totalValue - TOTAL_COST;
            const totalReturn = (totalPnl / TOTAL_COST) * 100;
            
            document.getElementById('total-value').textContent = formatMoney(totalValue);
            
            const totalPnlEl = document.getElementById('total-pnl');
            totalPnlEl.textContent = formatMoney(totalPnl);
            totalPnlEl.className = `value ${totalPnl >= 0 ? 'positive' : 'negative'}`;
            
            const totalReturnEl = document.getElementById('total-return');
            totalReturnEl.textContent = formatPercent(totalReturn);
            totalReturnEl.className = `value ${totalReturn >= 0 ? 'positive' : 'negative'}`;
        }

        // 頁面載入時自動抓取股價
        fetchPrices();
    </script>
</body>
</html>
